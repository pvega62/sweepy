# ─────────────────────────────────────────────────
# Sweepy — Sample Profile Configuration
# ─────────────────────────────────────────────────

name: "Alex Rivera"

search:
  titles:
    - "Paralegal"
    - "Legal Assistant"
    - "Litigation Support Specialist"
    - "Legal Secretary"
  location: "New York, NY"
  remote_only: false
  include_hybrid: true   # Set to false to exclude hybrid positions
  min_salary: 65000

resume:
  path: "C:/path/to/resume.pdf"
  must_have_skills:
    - "Westlaw"
    - "LexisNexis"
    - "e-discovery"
    - "Contract Review"
  keywords_weight: 1.5

platforms:
  greenhouse: true
  ashby: true
  lever: true
  workable: true
  aggregators: false
  # Add custom platforms or ATS domains:
  custom:
    - name: "SmartRecruiters"
      domain: "smartrecruiters.com"
      enabled: true
    - name: "Breezy HR"
      domain: "breezy.hr"
      enabled: true

export:
  format: "pdf,csv"
  output_dir: "results"
