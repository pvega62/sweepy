name: "Alex Rivera"

search:
  titles:
    - "Paralegal"
    - "Legal Assistant"
    - "Litigation Support Specialist"
    - "Legal Secretary"
  location: "New York, NY"
  remote_only: false
  include_hybrid: true
  min_salary: 65000

resume:
  path: "C:/path/to/alex_paralegal_resume.pdf"
  must_have_skills:
    - "Westlaw"
    - "LexisNexis"
    - "e-discovery"
    - "Contract Review"
    - "Legal Research"
    - "Litigation Support"
  keywords_weight: 1.5

platforms:
  greenhouse: true
  ashby: true
  lever: true
  workable: true
  aggregators: false
  custom:
    - name: "SmartRecruiters"
      domain: "smartrecruiters.com"
      enabled: true
    - name: "Breezy HR"
      domain: "breezy.hr"
      enabled: true

sources:
  jobspy:
    linkedin: true
    indeed: true
    glassdoor: true
    zip_recruiter: true
  ashby:
    orgs:
      - "crosby"
      - "normlaw"
      - "hargrove-firm"
      - "lawhive"
  workable:
    slugs:
      - "shegerianand-associates-1"
      - "harper-james"
      - "legalvision"
  builtinnyc:
    enabled: true
    categories:
      - "jobs/legal"
      - "jobs/legal/search/paralegal"

report:
  style: "cards"
  cards_per_page: 6
  max_cards: 24
  destinations: []

export:
  format: "pdf,csv,json"
  output_dir: "results"