# ─────────────────────────────────────────────────
# Sweepy — Sample Profile Configuration
# ─────────────────────────────────────────────────

# Your name (appears in the PDF report header)
name: "Job Seeker"

# ─── Job Search Settings ──────────────────────────
search:
  # List every job title you want to find.
  titles:
    - "Front End Developer"
    - "React Engineer"

  # Your target city and state.
  location: "New York, NY"

  # Set to true to ONLY see remote roles.
  remote_only: false

  # Set to false to exclude hybrid positions.
  include_hybrid: true

  # Minimum annual salary filter (optional, leave as 0 to skip).
  min_salary: 0

# ─── Resume Settings ─────────────────────────────
resume:
  # The full path to your resume PDF on your computer.
  # Windows users: Use double backslashes (\\) or forward slashes (/)
  path: "C:/path/to/your/resume.pdf"

  # Must-have skills to prioritize for the match percentage.
  must_have_skills:
    - "React"
    - "TypeScript"
    - "JavaScript"
    - "CSS"

  keywords_weight: 1.5

  # Optional: multiple resume tracks for dual-targeting. The best track is chosen per
  # job by keyword overlap; leave empty to use `path` as a single implicit track.
  tracks:
    - name: "Tech Writer Resume"
      path: "C:/path/to/tech_writer.pdf"
      color: "#1D4ED8"
      route_keywords: ["api", "docs-as-code", "developer"]
    - name: "UX Writer Resume"
      path: "C:/path/to/ux_writer.pdf"
      color: "#7E22CE"
      route_keywords: ["ux", "content design", "microcopy"]

# ─── Platform Settings ────────────────────────────
# Set each platform to true or false to enable or disable it.
platforms:
  greenhouse: true
  ashby: true
  lever: true
  workable: true
  aggregators: false   # Free feeds like Remotive, Adzuna

  # Optional: add custom ATS endpoints or company career domains.
  custom:
    - name: "SmartRecruiters"
      domain: "smartrecruiters.com"
      enabled: true
    # Add more entries below as needed:
    # - name: "My Company"
    #   domain: "careers.mycompany.com"
    #   enabled: true

# ─── Deterministic (no-key) sources ──────────────
# Empty orgs/slugs/categories fall back to the curated seed lists in data/sources/.
sources:
  jobspy:
    linkedin: true
    indeed: true
    glassdoor: true
    zip_recruiter: true
  ashby:
    orgs: []
  workable:
    slugs: []
  builtinnyc:
    enabled: true
    categories: []

# ─── Report Settings ─────────────────────────────
report:
  # "cards" (default) renders the curated card layout; "legacy" keeps the old layout.
  style: "cards"
  cards_per_page: 4
  max_cards: 24       # 0 = unlimited
  destinations: []    # extra directories to copy the PDF into

# ─── Export Settings ──────────────────────────────
export:
  # Comma-separated list of output formats. Options: pdf, csv, json
  format: "pdf,csv"
  output_dir: "results"
