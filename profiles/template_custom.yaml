# ─────────────────────────────────────────────────
# Sweepy — Fill-In Profile Template
# ─────────────────────────────────────────────────
#
# This file is the manual route. Fill it in, run it, and skip both the wizard
# prompts and the MCP server.
#
# 1. Copy the file under a name of your own.
#      PowerShell:   Copy-Item profiles\template_custom.yaml profiles\my_search.yaml
#      macOS/Linux:  cp profiles/template_custom.yaml profiles/my_search.yaml
# 2. Fill in the four REQUIRED values below.
# 3. Run your copy.
#      sweepy --profile profiles/my_search.yaml
#
# Sweepy records that path as your last profile, so `sweepy --run` repeats this
# search later. When the `sweepy` command is not on PATH, run
# `python swee.py --profile profiles/my_search.yaml` instead.
#
# Every setting you leave out falls back to the default named in its comment.
# The complete setting list lives at:
# https://pvega62.github.io/software/docs/sweepy/reference/configuration-reference

# ─── You ─────────────────────────────────────────
# REQUIRED. Prints in the PDF header.
name: "Your Name"

# Set true to write rotating debug logs under logs/.
# debug: false

# ─── Job Search Settings ──────────────────────────
search:
  # REQUIRED. One or more titles. Each title runs as its own query, so keep the
  # list to roles you would actually accept.
  titles:
    - "Your Job Title"
    - "A Related Title"

  # REQUIRED. City and state code, such as "Austin, TX". Remote-only searches
  # still use it to rank nearby postings.
  location: "Your City, ST"

  # true keeps remote postings only.
  remote_only: false

  # false drops hybrid postings.
  include_hybrid: true

  # Annual salary floor. 0 turns the filter off.
  min_salary: 0

  # true reads pay from the posting text when a board publishes no pay field.
  salary_from_description: true

# ─── Resume Settings ─────────────────────────────
resume:
  # REQUIRED. Full path to your resume in .pdf or .docx form.
  # Windows accepts C:/Users/you/resume.pdf and C:\\Users\\you\\resume.pdf.
  # On Windows 11, select the file in File Explorer and press Ctrl+Shift+C to
  # copy its path.
  path: "C:/path/to/your/resume.pdf"

  # Optional. Skills that lift a score when a posting mentions them. Replace
  # both entries, or set the list to [] to score from resume keywords alone.
  must_have_skills:
    - "Your Strongest Skill"
    - "Another Skill"

  # Multiplier for resume keywords in the score. 1.5 favors your resume terms.
  keywords_weight: 1.5

  # Optional. Interchangeable terms. Sweepy matches every member of a group in
  # both directions, so `electronic discovery` in a posting matches `e-discovery`
  # on your resume. Each group needs at least two terms. Uncomment and replace:
  # synonyms:
  #   - [electronic discovery, e-discovery, ediscovery]
  #   - [front end, frontend, front-end]

  # Optional. Several resumes for different targets. Sweepy picks the best track
  # for each posting by keyword overlap. An empty list scores with `path` alone.
  tracks: []
  # tracks:
  #   - name: "Primary Resume"
  #     path: "C:/path/to/primary.pdf"
  #     color: "#1D4ED8"
  #     route_keywords: ["api", "documentation", "developer"]
  #   - name: "Secondary Resume"
  #     path: "C:/path/to/secondary.pdf"
  #     color: "#7E22CE"
  #     route_keywords: ["ux", "content design", "microcopy"]

# ─── Platform Settings ────────────────────────────
# true turns a board on. Every flag below ships on except `aggregators`.
platforms:
  greenhouse: true
  ashby: true
  lever: true
  workable: true
  aggregators: false   # Free feeds like Remotive and Adzuna

  # Optional. Extra ATS endpoints or company career domains. Uncomment to add:
  custom: []
  # custom:
  #   - name: "SmartRecruiters"
  #     domain: "smartrecruiters.com"
  #     enabled: true

# ─── Job engines ─────────────────────────────────
# Sweepy 3.0 runs every enabled engine in parallel behind one adapter.
#
#   jobspy    built in   LinkedIn, Indeed, Glassdoor, ZipRecruiter (+ Bayt, Naukri,
#                        BDJobs, HelloWork). Supports proxies, User-Agent, and a
#                        description toggle.
#   ats       built in   Greenhouse, Ashby, Lever, Workable, and Built In NYC, read
#                        straight from each employer's public board.
#   hirehunt  download   India-first boards plus LinkedIn and Indeed APIs.
#   openroles download   Greenhouse, Lever, Ashby, and Workday boards you name.
#   jobdrop   download   33 boards including Google and Wellfound.
#   apify     download   Managed actors. Needs APIFY_TOKEN.
#
# Install an optional engine from the wizard (Sweepy's Toolbox > Download job engines)
# or with `sweepy --install-engines all`.
#
# `enabled` is optional. Leave it out and Sweepy runs jobspy plus the native
# applicant tracking system (ATS) readers. It also turns on any optional engine
# whose block sets `enabled: true` and has the inputs it needs. Listing engines
# explicitly pins the set instead.

# ─── Sources ─────────────────────────────────────
# Empty boards/orgs/slugs/categories fall back to the curated seed lists in
# data/sources/. Each source also honors its platforms.<x> flag.
sources:
  # enabled: [jobspy, ats]
  jobspy:
    linkedin: true
    indeed: true
    glassdoor: true
    zip_recruiter: true
    # Newer shape. It overrides the board booleans.
    # sites: [linkedin, indeed, glassdoor, zip_recruiter]
    # Proxies are opt-in. Sweepy reads them only from this file.
    # proxies: ["user:pass@host:port"]
    # Descriptions supply the scoring text. Turn this off only when you accept
    # weaker match scores in exchange for a faster sweep.
    fetch_descriptions: true
  greenhouse:
    enabled: true
    boards: []          # e.g. ["gitlab", "cloudflare"]
  ashby:
    enabled: true
    orgs: []            # e.g. ["modal", "camunda"]
  lever:
    enabled: true
    companies: []       # e.g. ["leverdemo", "spotify"]
  workable:
    enabled: true
    slugs: []           # e.g. ["soda-data-nv"]
  builtinnyc:
    enabled: true
    categories: []      # e.g. ["jobs/technical-writer"]
    detail_pages: false # read each posting's full text; Built In rate-limits these

  # Optional engines. Install the library first, then uncomment a block.
  # jobdrop also conflicts with JobSpy's curl_cffi pin, so install it separately
  # with: sweepy --install-engines jobdrop --allow-engine-conflicts
  # hirehunt:
  #   sources: [linkedin, indeed, naukri, internshala, shine]
  # openroles:
  #   ats: [greenhouse, lever, ashby, workday]
  #   companies: [figma, stripe, notion]   # required to enable OpenRoles; it reads boards you name
  # jobdrop:
  #   sites: [linkedin, indeed, google, glassdoor]
  #   headless: true
  #   fetch_descriptions: true
  # apify:
  #   actor: curious_coder/linkedin-jobs-scraper   # reads APIFY_TOKEN from the environment

# ─── Engine performance ──────────────────────────
# Results cache for an hour, so repeat runs of the same query return instantly.
cache:
  enabled: true
  ttl_seconds: 3600

# Sweepy hides postings it already reported. A posting can return after
# retention_days pass. `path: null` uses ~/.sweepy/history.db.
history:
  enabled: true
  retention_days: 4
  match: "url+role"
  path: null

# One slow engine can't stall the sweep. After five failures, Sweepy pauses that
# engine for 30 seconds.
orchestrator:
  timeout_per_source_seconds: 180
  circuit_breaker:
    failure_threshold: 5
    cooldown_seconds: 30

# ─── Report Settings ─────────────────────────────
report:
  # "cards" (default) renders the curated card layout; "legacy" keeps the old layout.
  style: "cards"
  cards_per_page: 6
  max_cards: 24       # 0 = unlimited
  destinations: []    # extra directories to copy the PDF into
  # MCP only. "agent" blocks a keyword-only render until every card carries a
  # judgment; "keyword" allows one. The CLI writes the PDF directly and skips it.
  # assessment: "agent"

# ─── Export Settings ──────────────────────────────
export:
  # Comma-separated list of output formats. Options: pdf, csv, json
  format: "pdf,csv"
  output_dir: "results"

  # Append job-tracking columns to the CSV: date_applied, status, interview_stage,
  # offer_amount, offer_date, follow_up_date, contact, and notes. Values you enter
  # carry over to the next sweep of this profile. Set to false for raw data only.
  tracking: true

  # Characters of posting text saved in the CSV and JSON. Sweepy cuts on a
  # sentence boundary. Set to 0 to keep the whole posting.
  description_chars: 1000

  # Clock behind the date and time in each report filename. "local" follows this
  # machine, "UTC" pins Coordinated Universal Time, and an IANA name such as
  # "America/New_York" or an offset such as "-05:00" picks another zone.
  timezone: "local"
