name: CI

on:
  push:
    branches: [main, draft]
  pull_request:
    branches: [main, draft]

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Test with pytest
        run: pytest -q --junitxml=test-results.xml --cov=swee --cov=server --cov=engine.scorer --cov-report=term --cov-report=xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

      - name: Report pytest failures
        if: always()
        shell: bash
        run: |
          python -c 'from xml.etree import ElementTree as ET; import os; p="test-results.xml"; print("### Pytest failures"); failures=[]; root=ET.parse(p).getroot() if os.path.exists(p) else None; failures=[case for case in root.iter("testcase") if case.find("failure") is not None or case.find("error") is not None] if root is not None else []; [print(f"- {case.get(\"classname\", \"\")}::{case.get(\"name\", \"\")}\n  {next(iter([node.text for node in [case.find(\"failure\"), case.find(\"error\")] if node is not None]), \"\")[:2000]}") for case in failures[:20]]; print("No test result file found." if root is None else "No failures found." if not failures else "")' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
