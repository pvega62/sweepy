# Vale Configuration File for Sweepy

StylesPath = styles

Packages = Microsoft, proselint, write-good, alex, Joblint, Hugo, MDX, Google, https://github.com/vale-cli/Std/releases/latest/download/Std.zip,  https://github.com/jdkato/voices/releases/latest/download/Voices.zip, Diataxis, ai-tells, A11y

MinAlertLevel = suggestion

# NOTE: Diataxis is not a top-level style name; its package installs as
# Explanation/HowTo/Reference/Tutorial. Scope those to a specific folder rather
# than listing "Diataxis" in BasedOnStyles, which makes Vale abort with E201.
# A11y is a real registry package (jdkato/a11y) and a valid style name.

[*]
BasedOnStyles = Microsoft, Google, proselint, write-good, alex, Joblint, Std, Voices, Direct, ai-tells, A11y

# Spelling disabled - too many false positives on project terms
# Use .valeignore file or project dictionary for proper spelling exclusions
Vale.Spelling = NO

# Direct.Length enforces "One-Breath" rule (max 25 words/sentence) - GEMINI.md requirement
Direct.Length = suggestion

# Direct.Ease (Flesch reading ease) enabled for accessibility
Direct.Ease = error

[*.{md,mdx}]
BasedOnStyles = Microsoft, Google, proselint, write-good, alex, Joblint, Std, Voices, Direct, ai-tells, A11y

# The Microsoft package carries two general-audience help rules that misfire on
# developer-facing docs. GeneralURL asks for "address" instead of "URL", and
# Terms asks for "personal digital assistant" instead of "Agent" (it also
# matches the "Agent" inside "User-Agent"). Both terms are precise and correct
# in a repo README or changelog, so the rules stay off for Markdown.
Microsoft.GeneralURL = NO
Microsoft.Terms = NO

# Short technical lead-ins ("Verify your installation:") cannot reach a 50
# Flesch score, so report readability without failing the run.
Direct.Ease = warning

[*.{rst,rest}]
BasedOnStyles = Microsoft, Google, proselint, write-good, alex, Joblint, Std, Voices, Direct, ai-tells, A11y

[*.adoc]
BasedOnStyles = Microsoft, Google, proselint, write-good, alex, Joblint, Std, Voices, Direct, ai-tells, A11y

# Std Library Rules (https://github.com/vale-cli/Std)
# Abbreviations
Std.Abbreviations.Acronyms = suggestion
Std.Abbreviations.Latin = suggestion

# DateTime
Std.DateTime.DateFormat = suggestion
Std.DateTime.TimeFormat = suggestion

# Grammar
Std.Grammar.Contractions = suggestion
Std.Grammar.PassiveVoice = suggestion

# Punctuation
Std.Punctuation.OxfordComma = warning
Std.Punctuation.Ellipses = suggestion
Std.Punctuation.Spacing = warning

# Readability - One-Breath rule (25 words max)
Std.Readability.SentenceLength = warning

# Usage
Std.Usage.FirstPersonSingular = suggestion
Std.Usage.FirstPersonPlural = suggestion
Std.Usage.GenderedPronouns = suggestion
Std.Usage.GenderedTerms = suggestion